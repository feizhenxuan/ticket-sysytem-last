# 必填字段，编译打包强制指定此工程类型为 SOFABoot
sofa.version=SOFABoot
# 应用名称
spring.application.name=ticketbacked
# 服务器端口
server.port=8888
management.server.port=9500
# 服务器zone信息
domain.name=@domainname@
inner.domain=${domain.name}
# 应用日志级别
logging.level.com.alipay.ticketbacked=INFO
# 日志目录，编译打包校验该字段
logging.path=/home/admin/logs
logging.root=${logging.path}
logging.config=classpath:log4j2-spring.xml
# 近段包解析velocity语法判断版本用
sofa_runtime_spring_major_version=4
# 忽略未解析的占位符
sofa.boot.ignore.unresolvable.placeholders=true
# 网商应用开启 Fast ClassLoader 能力，非网商应用通过 hook.sh 中的 SOFABOOT_JAR_LAUNCHER 开启
use_indexJar_launcher=true

# ============================================================
#  DataSource (ZDAL via DDS - 蚂蚁数据访问层)
#  联调/生产环境由 Linke 通过 DDS 自动注入，无需 spring.datasource.* 配置
# ============================================================
com.alipay.sofa.dds.appName=zzvonehxtickettest
com.alipay.sofa.dds.appDsName=zzvonetickettest_ds
com.alipay.sofa.dds.dbMode=dev

# ============================================================
#  MyBatis
# ============================================================
mybatis.mapper-locations=classpath*:mybatis/mapper/*.xml
mybatis.type-aliases-package=com.alipay.ticketbacked.core.model
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================================
#  Jackson — 全局 snake_case 输出对齐前端
# ============================================================
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ============================================================
#  JWT
# ============================================================
app.jwt.secret=your-super-secret-key-change-in-production
app.jwt.algorithm=HS256
app.jwt.expire-hours=24

