spring.application.name=ticketbacked
server.port=${SERVER_PORT:8888}
management.server.port=${MANAGEMENT_SERVER_PORT:9500}

logging.level.com.alipay.ticketbacked=${APP_LOG_LEVEL:INFO}
logging.file.path=${LOGGING_PATH:./logs}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ticketbacked;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

mybatis.mapper-locations=classpath*:mybatis/mapper/*.xml
mybatis.type-aliases-package=com.alipay.ticketbacked.core.model
mybatis.configuration.map-underscore-to-camel-case=true

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${APP_JWT_SECRET:local-development-secret-change-me}
app.jwt.algorithm=HS256
app.jwt.expire-hours=${APP_JWT_EXPIRE_HOURS:24}

app.alipay.app-id=${ALIPAY_APP_ID:local-dev-app-id}
app.alipay.app-private-key=${ALIPAY_APP_PRIVATE_KEY:}
app.alipay.public-key=${ALIPAY_PUBLIC_KEY:}
app.alipay.gateway=${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
app.alipay.return-url=${ALIPAY_RETURN_URL:http://localhost:8000/pay/return}
app.alipay.notify-url=${ALIPAY_NOTIFY_URL:}

app.amap.api-key=${AMAP_API_KEY:}
app.amap.base-url=${AMAP_BASE_URL:https://restapi.amap.com}

spring.ai.openai.api-key=${OPENAI_API_KEY:local-dev-key}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.3}
spring.ai.openai.chat.options.max-tokens=${OPENAI_MAX_TOKENS:2048}
